<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title description">
  <title id="title">Учебная втулка — демонстрация интерфейса</title>
  <desc id="description">Условный эскиз для проектирования интерфейса. Четыре поверхности, без фасок. Не производственный чертёж.</desc>
