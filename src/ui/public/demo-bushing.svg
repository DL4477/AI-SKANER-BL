    <g fill="none" stroke="#526176" stroke-width="1"><path d="M130 362V406M430 362V406M130 394H430M124 388L136 400M424 388L436 400M122 155H63M122 355H63M76 155V355M70 149L82 161M70 349L82 361M438 205H506M438 305H506M495 205V305M489 199L501 211M489 299L501 311M330 155L345 128H412"/></g>
    <text x="269" y="386" font-size="15">30</text><text transform="translate(65 291) rotate(-90)" font-size="15">Ø40 ±0,1</text><text transform="translate(485 275) rotate(-90)" font-size="15">Ø20</text><text x="347" y="120" font-size="15">Ra 1,6</text>
    <text x="239" y="435" font-size="12">Продольный разрез</text><text x="577" y="345" font-size="12">Вид с торца</text>
    <text x="100" y="467" font-size="14">Ra 3,2 для поверхностей без местного обозначения</text>
