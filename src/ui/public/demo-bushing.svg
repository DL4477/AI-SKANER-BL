    <g fill="url(#hatch)" stroke="#283649" stroke-width="2"><path d="M130 155H430V205H130ZM130 305H430V355H130Z"/><circle cx="615" cy="225" r="75"/><circle cx="615" cy="225" r="37.5" fill="#fff"/></g>
