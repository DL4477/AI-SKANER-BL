[package]
name = "ai-skaner"
version = "0.2.0"
description = "Local workspace for engineering PDF drawings"
repository = "https://github.com/DL4477/AI-SKANER-BL"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ai_skaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "system-proxy"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
zeroize = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "macros", "time"] }
